xt><text x="1180" y="898" class="small" font-weight="bold">АЛЬ-ХАР / БАСТИ</text><text x="1180" y="924" class="small">Тюрьма и стража / трущобы</text><text x="1180" y="947" class="tiny">Две отдельные локации</text><text x="1180" y="999" class="small" font-weight="bold">ТЕАТР «МИР» ↔ GRAPEVINE</text><text x="1180" y="1025" class="small">Театр напротив ресторана Морли</text><text x="1180" y="1048" class="tiny">Поздние книги; отдельная пара</text><path d="M65 1190 H1535" stroke="#b6a785"/><circle cx="79" cy="1220" r="7" class="pin"/><text x="98" y="1226" class="small">Место подтверждено текстом; точная точка условна</text><path d="M750 1220 H797" class="minor"/><text x="810" y="1226" class="small">Условная трасса или граница</text><text x="65" y="1265" class="small">Чаттари: «центр» в книге 3, «крайний запад» в книге 8. На карте использовано позднее описание.</text></svg>